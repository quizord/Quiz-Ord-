<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> 
    <title>QuizOrd - Debug</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .debug-box {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
        }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
        .path { 
            background: rgba(0,0,0,0.3); 
            padding: 10px; 
            margin: 5px 0; 
            border-radius: 5px;
            font-family: monospace;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            margin: 20px;
        }
        img {
            max-width: 200px;
            max-height: 100px;
            margin: 10px;
            border: 2px solid white;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🔍 Debug - Testar bildsökvägar</h1>
    
    <div class="debug-box" id="results">
        <p>Testar sökvägar...</p>
    </div>
    
    <div class="debug-box">
        <h3>Förhandsvisning (första fungerande bild):</h3>
        <div id="preview"></div>
    </div>
    
    <button onclick="location.reload()">🔄 Testa igen</button>
    
    <script>
        var pathsToTest = [
            'Thumbnail.png',
            './Thumbnail.png',
            'Main/Thumbnail.png',
            './Main/Thumbnail.png',
            '../Thumbnail.png',
            '../Main/Thumbnail.png',
            '/Thumbnail.png',
            '/Main/Thumbnail.png',
            'thumbnail.png',
            './thumbnail.png',
            'Main/thumbnail.png',
            './Main/thumbnail.png'
        ];
        
        var resultsDiv = document.getElementById('results');
        var previewDiv = document.getElementById('preview');
        var foundImage = false;
        
        resultsDiv.innerHTML = '<h3>Testar ' + pathsToTest.length + ' olika sökvägar:</h3>';
        
        pathsToTest.forEach(function(path, index) {
            var img = new Image();
            var pathDiv = document.createElement('div');
            pathDiv.className = 'path';
            pathDiv.innerHTML = '🔄 Testar: <strong>' + path + '</strong> ...';
            resultsDiv.appendChild(pathDiv);
            
            img.onload = function() {
                pathDiv.className = 'path success';
                pathDiv.innerHTML = '✅ FUNGERAR: <strong>' + path + '</strong>';
                
                if (!foundImage) {
                    foundImage = true;
                    previewDiv.innerHTML = '<p class="success">✅ Bild hittad!</p><img src="' + path + '" alt="Thumbnail">';
                }
            };
            
            img.onerror = function() {
                pathDiv.className = 'path error';
                pathDiv.innerHTML = '❌ <strong>' + path + '</strong> - hittades inte';
            };
            
            // Ladda bilden efter en liten fördröjning för att se resultaten
            setTimeout(function() {
                img.src = path;
            }, index * 200);
        });
        
        // Efter att alla tester är klara
        setTimeout(function() {
            if (!foundImage) {
                resultsDiv.innerHTML += '<h3 class="error">⚠️ Ingen bild hittades!</h3>';
                resultsDiv.innerHTML += '<p>Kontrollera att Thumbnail.png finns i någon av dessa mappar</p>';
            } else {
                resultsDiv.innerHTML += '<h3 class="success">✅ Minst en sökväg fungerade!</h3>';
            }
        }, pathsToTest.length * 200 + 500);
    </script>
</body>
</html>
