<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizOrd - Gåtfull Ordlek</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);margin:0;padding:20px;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center}
.container{background:rgba(255,255,255,0.95);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.4);max-width:650px;width:100%;padding:30px 35px 40px 35px;text-align:center;transition:background 0.3s}
.logo-container{margin-bottom:20px}
.logo-container img{max-width:300px;width:80%;height:auto}
.welcome-text{color:#333;font-size:1.2rem;line-height:1.8;margin:0 0 30px 0;font-weight:500;transition:color 0.3s}
.welcome-text .highlight{font-weight:700}
.highlight-read{color:#c0392b}
.highlight-solve{color:#1a4f8a}
.highlight-crack{color:#1e8449}
.game-card{background:linear-gradient(135deg,#667eea15 0%,#764ba215 100%);border:2px solid #667eea;border-radius:15px;padding:20px;margin:0 auto 15px auto;max-width:500px;transition:border-color 0.3s}
.game-thumbnail{width:100%;height:350px;background:white;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;border:2px solid #ddd;overflow:hidden;transition:background 0.3s,border-color 0.3s}
.game-thumbnail img{width:100%;height:100%;object-fit:contain}
.cta-button{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:16px 50px;border-radius:50px;text-decoration:none;font-weight:bold;font-size:1.2rem;border:none;cursor:pointer;transition:all 0.3s ease;box-shadow:0 5px 15px rgba(102,126,234,0.3);min-height:48px}
.cta-button:hover{transform:scale(1.05);box-shadow:0 8px 25px rgba(102,126,234,0.5)}
.cta-button:active{transform:scale(0.95)}
.footer{padding-top:20px;border-top:1px solid #ddd;color:#777;font-size:0.9rem;transition:color 0.3s,border-color 0.3s}
.footer-note{color:#777;font-size:0.85rem;margin-top:8px;font-style:italic;transition:color 0.3s}

body.dark{background:linear-gradient(135deg,#0d0d1a 0%,#0f0f2e 50%,#1a1a4e 100%)}
body.dark .container{background:rgba(22,33,62,0.97)}
body.dark .welcome-text{color:#e0e0e0}
body.dark .game-card{border-color:#4a6cf7}
body.dark .game-thumbnail{background:#1a1a3e;border-color:#333}
body.dark .footer{border-top-color:#333;color:#aaa}
body.dark .footer-note{color:#aaa}

.dark-toggle{position:fixed;top:15px;right:15px;z-index:999;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:0.9rem;backdrop-filter:blur(6px);transition:0.3s}
.dark-toggle:hover{background:rgba(255,255,255,0.25)}

@media(max-width:500px){
body{padding:10px}
.container{padding:15px 15px 18px 15px}
.logo-container{margin-bottom:6px}
.logo-container img{max-width:160px}
.welcome-text{font-size:0.95rem;line-height:1.5;margin:0 0 10px 0}
.game-card{padding:10px;margin:0 auto 8px auto}
.game-thumbnail{height:180px;margin-bottom:10px}
.cta-button{padding:12px 30px;font-size:1rem;min-height:44px}
.footer{padding-top:10px;font-size:0.8rem}
.footer-note{font-size:0.75rem;margin-top:4px}
}
@media(min-width:501px) and (max-width:1024px) and (orientation:portrait){
.container{padding:25px 25px 30px 25px}
.game-thumbnail{height:300px}
.logo-container img{max-width:240px}
}
@media(min-width:501px) and (max-width:1024px) and (orientation:landscape){
body{padding:12px}
.container{padding:16px 30px 20px 30px;max-width:850px}
.logo-container{margin-bottom:5px}
.logo-container img{max-width:120px}
.welcome-text{font-size:1rem;margin:0 0 10px 0;line-height:1.5}
.game-card{padding:16px 24px;margin:0 auto 10px auto;max-width:700px;display:flex;gap:20px;align-items:center}
.game-thumbnail{height:200px;width:55%;flex-shrink:0;margin-bottom:0}
.cta-button{padding:14px 40px;font-size:1.1rem;min-height:44px;white-space:nowrap;flex-shrink:0}
.footer{padding-top:8px;font-size:0.8rem}
.footer-note{font-size:0.75rem;margin-top:3px}
}
@media(min-width:1025px) and (orientation:landscape){
body{padding:10px}
.container{padding:14px 35px 18px 35px;max-width:750px}
.logo-container{margin-bottom:5px}
.logo-container img{max-width:110px}
.welcome-text{font-size:0.95rem;margin:0 0 8px 0;line-height:1.5}
.game-card{padding:14px 20px;margin:0 auto 8px auto;max-width:600px;display:flex;gap:18px;align-items:center}
.game-thumbnail{height:190px;width:52%;flex-shrink:0;margin-bottom:0}
.cta-button{padding:12px 36px;font-size:1rem;min-height:44px;white-space:nowrap;flex-shrink:0}
.footer{padding-top:8px;font-size:0.8rem}
.footer-note{font-size:0.75rem;margin-top:3px}
}
</style>
</head>
<body>
<button class="dark-toggle" onclick="toggleDark()" id="darkToggle">🌙 Dark mode</button>
<div class="container">
<div class="logo-container">
<img src="logo.png" alt="QuizOrd Logga">
</div>
<div class="welcome-text">
Välkommen till QuizOrd!<br>
<span class="highlight highlight-read">LÄS</span> gåtan · 
<span class="highlight highlight-solve">LÖS</span> korsordet · 
<span class="highlight highlight-crack">KNÄCK</span> den kryptiska ord-nöten tillsammans!
</div>
<div class="game-card">
<div class="game-thumbnail">
<img src="Thumbnail.png" alt="QuizOrd teaser">
</div>
<a href="game.html" class="cta-button">▶️ Starta spelet</a>
</div>
<div class="footer">
<p>💡 Tips: Spela gärna tillsammans med någon – två hjärnor är bättre än en!</p>
<p class="footer-note">QuizOrd — Utvecklat med ❤️ för ordälskare</p>
</div>
</div>
<script>
function toggleDark(){document.body.classList.toggle('dark');const b=document.getElementById('darkToggle');b.textContent=document.body.classList.contains('dark')?'☀️ Light mode':'🌙 Dark mode';}
</script>
</body>
</html>
