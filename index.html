<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> 
    <title>QuizOrd - Gåtfull Ordlek</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(10px, 2vw, 20px);
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: clamp(12px, 2vw, 20px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            max-width: 650px;
            width: 100%;
            max-height: 100%;
            height: auto;
            padding: clamp(15px, 3vw, 30px) clamp(15px, 3vw, 35px);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: clamp(8px, 1.5vw, 15px);
        }
        
        .logo-container {
            flex-shrink: 0;
        }
        
        .logo-container img {
            max-width: min(300px, 60%);
            width: auto;
            height: clamp(40px, 8vw, 80px);
            object-fit: contain;
        }
        
        .logo-fallback {
            display: none;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 800;
            color: #2c3e50;
        }
        
        .welcome-text {
            color: #333;
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            line-height: 1.6;
            font-weight: 500;
            flex-shrink: 0;
        }
        
        .welcome-text .highlight {
            font-weight: 700;
        }
        
        .highlight-read {
            color: #e74c3c;
        }
        
        .highlight-solve {
            color: #2c5aa0;
        }
        
        .highlight-crack {
            color: #27ae60;
        }
        
        .game-card {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border: 2px solid #667eea;
            border-radius: clamp(10px, 1.5vw, 15px);
            padding: clamp(10px, 2vw, 20px);
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.5vw, 15px);
            min-height: 0;
        }
        
        .game-thumbnail {
            flex: 1 1 auto;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ddd;
            overflow: hidden;
            min-height: 0;
            position: relative;
        }
        
        .game-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 5px;
        }
        
        .thumbnail-fallback {
            display: none;
            font-size: clamp(3rem, 8vw, 6rem);
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: clamp(10px, 2vw, 16px) clamp(30px, 6vw, 50px);
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: clamp(0.95rem, 2.5vw, 1.2rem);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            flex-shrink: 0;
            white-space: nowrap;
        }
        
        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        
        .footer {
            padding-top: clamp(8px, 1.5vw, 15px);
            border-top: 1px solid #eee;
            color: #999;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            flex-shrink: 0;
        }
        
        .footer-note {
            color: #888;
            font-size: clamp(0.65rem, 1.2vw, 0.85rem);
            margin-top: 4px;
            font-style: italic;
        }
        
        @media (max-height: 700px) {
            .welcome-text {
                font-size: 0.85rem;
                line-height: 1.4;
            }
            .welcome-text br {
                display: none;
            }
            .footer {
                font-size: 0.7rem;
                padding-top: 6px;
            }
            .footer-note {
                font-size: 0.65rem;
            }
        }
        
        @media (max-width: 900px) and (orientation: landscape) {
            .container {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px;
                padding: 12px 15px;
            }
            .logo-container {
                flex: 0 0 auto;
                width: auto;
            }
            .logo-container img {
                height: 35px;
            }
            .welcome-text {
                flex: 1 1 100%;
                font-size: 0.8rem;
                order: 1;
            }
            .game-card {
                flex: 1 1 60%;
                flex-direction: row;
                align-items: center;
                gap: 10px;
                order: 2;
            }
            .game-thumbnail {
                flex: 1 1 50%;
                min-height: 100px;
            }
            .cta-button {
                flex-shrink: 0;
                padding: 8px 20px;
                font-size: 0.85rem;
            }
            .footer {
                flex: 1 1 100%;
                order: 3;
                padding-top: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- LOGGA -->
        <div class="logo-container">
            <img src="https://quizord.github.io/quizord/main/logo.png"
                 alt="QuizOrd Logga" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="logo-fallback">🧩 QUIZORD</div>
        </div>
        
        <!-- VÄLKOMSTTEXT -->
        <div class="welcome-text">
            Välkommen till QuizOrd!<br>
            <span class="highlight highlight-read">LÄS</span> gåtan · 
            <span class="highlight highlight-solve">LÖS</span> korsordet · 
            <span class="highlight highlight-crack">KNÄCK</span> den kryptiska ord-nöten tillsammans!
        </div>
        
        <!-- SPELKORT MED THUMBNAIL -->
        <div class="game-card">
            <div class="game-thumbnail">
                <img src="https://quizord.github.io/quizord/main/Thumbnail.png" 
                     alt="QuizOrd teaser" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="thumbnail-fallback" style="display:none; align-items:center; justify-content:center; width:100%; height:100%;">🧩</div>
            </div>
            <a href="game.html" class="cta-button">▶️ Starta spelet</a>
        </div>
        
        <!-- SIDFOT -->
        <div class="footer">
            <p>💡 Tips: Spela gärna tillsammans med någon – två hjärnor är bättre än en!</p>
            <p class="footer-note">QuizOrd — Utvecklat med ❤️ för ordälskare</p>
        </div>
        
    </div>
</body>
</html>
